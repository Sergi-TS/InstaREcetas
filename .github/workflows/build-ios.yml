name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Podfile Code Signing
        run: |
          # Generar el Podfile (se crea automáticamente con este comando)
          flutter build ios --config-only || true
          
          # Inyectar regla para apagar la firma en todos los Pods (Firebase, etc)
          sed -i '' '/flutter_additional_ios_build_settings(target)/a\
              target.build_configurations.each do |config|\
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"\
              end\
          ' ios/Podfile || true

      - name: Build Flutter iOS (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Payload
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/InstaRecetas-Unsigned.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaRecetas-iOS
          path: build/ios/ipa/InstaRecetas-Unsigned.ipa
