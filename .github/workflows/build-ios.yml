name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Generate iOS Project Files
        run: flutter build ios --simulator --debug

      - name: Disable Code Signing in Pods and Project
        run: |
          # Apagar firmas en dependencias de Firebase
          sed -i '' '/flutter_additional_ios_build_settings(target)/a\
              target.build_configurations.each do |config|\
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"\
              end\
          ' ios/Podfile
          
          cd ios && pod install && cd ..
          
          # Apagar firmas en el proyecto principal
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj || true
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig

      - name: Build Unsigned App for Device
        run: |
          cd ios
          xcodebuild build -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package Payload
        run: |
          mkdir -p build/ios/ipa
          mkdir -p Payload
          cp -r ios/build/Release-iphoneos/Runner.app Payload/
          zip -r build/ios/ipa/InstaRecetas-Unsigned.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaRecetas-iOS
          path: build/ios/ipa/InstaRecetas-Unsigned.ipa
