workflows:
  ios-unsigned-build:
    name: Build Unsigned iOS App
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: |
          flutter pub get
      - name: Build iOS unsigned app
        script: |
          # 1. Dejar que Flutter prepare los Pods y archivos (si da error, lo ignoramos)
          flutter build ios --release --no-codesign || true
          
          # 2. Compilar manualmente con Xcode apagando cualquier firma
          cd ios
          xcodebuild build -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          cd ..
          
          # 3. Buscar la carpeta Runner.app generada y meterla en el zip
          mkdir -p Payload
          APP_PATH=$(find . -type d -name "Runner.app" | grep "Release-iphoneos" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r -q app.ipa Payload
    artifacts:
      - app.ipa
